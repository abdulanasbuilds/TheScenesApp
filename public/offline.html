<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="robots" content="noindex" />
    <title>You are offline — The Scenes</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .card {
        width: 100%;
        max-width: 30rem;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #4338ca;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.95rem;
        color: #475569;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-block;
        border-radius: 9999px;
        padding: 0.65rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
      .primary {
        background: #4338ca;
        color: #ffffff;
      }
      .primary:focus-visible,
      .secondary:focus-visible {
        outline: 2px solid #4338ca;
        outline-offset: 2px;
      }
      .secondary {
        background: #ffffff;
        color: #334155;
        border: 1px solid #cbd5e1;
      }
      .note {
        margin-top: 1.5rem;
        font-size: 0.78rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">The Scenes</p>
      <h1>You are offline</h1>
      <p>
        This page is a generic offline shell. It is not your account, and it does not show any
        personal, community or lesson content. Reconnect to continue where you left off.
      </p>
      <div class="actions">
        <a class="primary" href="/">Try again</a>
        <a class="secondary" href="/explore">Explore communities</a>
      </div>
      <p class="note">Nothing you do here is saved until you are back online.</p>
    </main>
  </body>
</html>
