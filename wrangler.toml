# The Scenes — Cloudflare Workers deployment config
# Frontend-only app: no database, auth, payment, or email services.
#
# BUILD FIRST:
#   bun run build
#
# DEPLOY:
#   bunx wrangler deploy

name = "the-scenes"
main = ".output/server/index.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Assets (client JS/CSS/fonts built by Vite → in .output/public)
[assets]
directory = ".output/public"
binding = "ASSETS"

[vars]
# No secrets required — the app stores data locally in the browser.
