name: The Scenes CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_DATA_MODE: fixtures

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (documented dev-only exception)
        run: bun run audit

      - name: Contract integrity
        shell: bash
        run: |
          set -euo pipefail

          test -f AGENTS.md
          test ! -e CLAUDE.md
          test ! -e CODEX.md
          test ! -e GEMINI.md
          test ! -e JULES.md
          test ! -e OPENCODE.md
          test ! -e .lovable

          if git grep -n -i -E 'lovable\.dev|x-lovable|\.lovable' -- ':!package-lock.json' ':!bun.lock'; then
            echo "Forbidden provider-specific branding/configuration detected."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit)
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Fixture Playwright suite
        run: bun run test:fixture

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .playwright/report
          retention-days: 3
          if-no-files-found: ignore
