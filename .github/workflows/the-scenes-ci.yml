name: The Scenes CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Contract integrity
        shell: bash
        run: |
          set -euo pipefail

          test -f AGENTS.md
          test ! -e CLAUDE.md
          test ! -e CODEX.md
          test ! -e GEMINI.md
          test ! -e JULES.md
          test ! -e OPENCODE.md
          test ! -e .lovable

          if git grep -n -i -E 'lovable\.dev|x-lovable|\.lovable' -- ':!package-lock.json' ':!bun.lock'; then
            echo "Forbidden provider-specific branding/configuration detected."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
